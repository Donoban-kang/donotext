name: Release

# Builds installers for Windows, macOS and Linux.
#  - push a tag such as v0.1.0  -> builds, then publishes a GitHub Release with the installers
#  - run it by hand (Actions tab) -> builds and keeps the installers as downloadable artifacts only
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            args: --linux
          - os: windows-latest
            label: Windows
            args: --win
          - os: macos-latest
            label: macOS
            args: --mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: A release tag must match the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No code-signing certificates are configured: build unsigned installers instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "donotext $GITHUB_REF_NAME" \
            --generate-notes \
            --draft
