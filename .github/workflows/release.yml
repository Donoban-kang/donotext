name: Release

# Builds installers for Windows, macOS and Linux.
#  - push a tag such as v0.1.0            -> builds, then creates a DRAFT GitHub Release with the installers
#  - run it by hand and fill in release_tag -> same, but GitHub creates the tag itself when you publish the draft
#  - run it by hand with release_tag empty  -> builds and keeps the installers as downloadable artifacts only
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag to release, e.g. v0.1.0 (must match package.json). Leave empty to only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            args: --linux
          - os: windows-latest
            label: Windows
            args: --win
          - os: macos-latest
            label: macOS
            args: --mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: A release tag must match the version in package.json
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match package.json version ($expected)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No code-signing certificates are configured: build unsigned installers instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # A draft release does not create its git tag yet: GitHub creates it, pointing at this
          # commit, when the draft is published. (--target is ignored if the tag already exists.)
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "donotext $TAG" \
            --generate-notes \
            --draft
