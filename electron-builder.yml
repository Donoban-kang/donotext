appId: com.donotext.app
productName: donotext
copyright: Copyright (c) donotext
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
compression: maximum
electronLanguages:
  - ko
  - en-US
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  category: Office
  target:
    - AppImage
fileAssociations:
  - ext: [md, markdown, mdown]
    name: Markdown document
    role: Editor
