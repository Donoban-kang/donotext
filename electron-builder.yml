appId: com.donotext.app
productName: donotext
copyright: Copyright (c) donotext
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
  # pdfjs-dist: only the legacy (Node) build, character maps, fonts and wasm are used for PDF import
  - '!node_modules/pdfjs-dist/{build,web,types}/**'
  - '!node_modules/pdfjs-dist/legacy/web/**'
  - '!node_modules/pdfjs-dist/legacy/build/*.min.mjs'
  # pdfjs's optional native canvas (~70 MB per platform) is only for drawing pages; text extraction does not use it
  - '!node_modules/@napi-rs/**'
  # tesseract.js 7.0.0 (pinned): its Node loader hands a boolean where getCore() compares numbers, so it always loads the
  # NON-"lstm" cores (one per CPU feature level: relaxedsimd, simd, plain). The "-lstm" cores are never required. Verify
  # with a packaged build and a real scan before changing this or the version.
  - '!node_modules/tesseract.js/{dist,docs,examples,scripts}/**'
  - '!node_modules/tesseract.js/*.min.js*'
  - '!node_modules/tesseract.js/tesseract.esm.min.js*'
  - '!node_modules/tesseract.js-core/*.wasm.js'
  - '!node_modules/tesseract.js-core/tesseract-core-lstm.*'
  - '!node_modules/tesseract.js-core/tesseract-core-simd-lstm.*'
  - '!node_modules/tesseract.js-core/tesseract-core-relaxedsimd-lstm.*'
# The import runs in worker threads, which cannot read files inside app.asar: pdfjs is loaded by file path, and the OCR
# engine starts its own worker thread from a script file and loads its WebAssembly core from disk, so the engine and
# everything its worker requires must sit outside app.asar.
asarUnpack:
  - node_modules/pdfjs-dist/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/{bmp-js,idb-keyval,is-url,node-fetch,whatwg-url,tr46,webidl-conversions,regenerator-runtime,wasm-feature-detect,zlibjs}/**
# Language data for text recognition (Korean and English), read straight from disk.
extraResources:
  - from: resources/ocr
    to: ocr
asar: true
compression: maximum
electronLanguages:
  - ko
  - en-US
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  category: Office
  target:
    - AppImage
fileAssociations:
  - ext: [md, markdown, mdown]
    name: Markdown document
    role: Editor
